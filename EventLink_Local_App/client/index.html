<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventLink Local</title><link rel="stylesheet" href="/styles.css"></head><body><header><div><b>EVENTLINK</b><small>LOCAL EVENT COMMUNICATION</small></div><span id="net">● LOCAL</span></header><main><section id="join" class="card join"><h1>Join Event</h1><p>Local event communication. Internet is optional.</p><input id="name" placeholder="Your name"><input id="code" placeholder="6-digit event code" maxlength="6" inputmode="numeric"><select id="platform"><option>Android</option><option>Windows 10/11</option></select><button id="joinBtn">JOIN EVENT</button><p id="msg"></p></section><section id="app" class="hidden"><aside class="card side"><h2 id="ename"></h2><div id="ecode" class="mono"></div><div id="me"></div><label>ROOM</label><select id="room"></select><button onclick="openHost()">HOST / ADMIN</button><button onclick="exportCsv()">EXPORT ATTENDANCE</button></aside><section class="content"><div class="bar"><b id="roomTitle">GENERAL</b><span id="online"></span><div><button onclick="act('POKE')">POKE</button><button class="g" onclick="act('CODE GREEN')">GREEN</button><button class="r" onclick="act('CODE RED')">RED</button><button class="b" onclick="act('CODE BLACK')">BLACK</button></div></div><div class="grid"><div class="card"><h3>Chat</h3><div id="chat" class="chat"></div><div class="compose"><input id="text" placeholder="Type a message..."><button onclick="send()">SEND</button></div></div><div class="card"><h3>People</h3><div id="people"></div></div></div></section></section></main><dialog id="host"><h2>Host Control</h2><input id="token" placeholder="Host token from server window"><button onclick="unlock()">UNLOCK</button><div id="pending"></div><div id="logs"></div><button onclick="host.close()">CLOSE</button></dialog><script src="/app.js"></script></body></html>
